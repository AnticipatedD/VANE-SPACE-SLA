[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "vane-space-sla"
version = "1.0.0"
description = "Enterprise Telemetry Validation and Prompt Grounding Backend Service Engine"
authors = ["AnticipatedD"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "2.10.4"
pydantic-settings = "2.7.0"
structlog = "24.3.0"
python-dotenv = "1.0.1"
pyjwt = "2.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-mock = "3.14.0"
pytest-cov = "6.0.0"
ruff = "0.8.4"
mypy = "1.13.0"
pip-audit = "2.7.3"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
