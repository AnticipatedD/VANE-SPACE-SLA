name: vane-space-sla

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    command: ["pytest", "--cov=.", "--cov-report=term-missing", "-v", "tests/"]
