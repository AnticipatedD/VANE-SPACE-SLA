name: VANE-SPACE-SLA CI Pipeline Verification Dashboard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime (Frontend Linter Check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Javascript Quality Checks
        run: |
          if [ -f package.json ]; then
            npm install
            npm run lint
            npm test
          fi

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Requirements Stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Execute Security Dependency Audits
        run: pip-audit

      - name: Verify Code Cleanliness Standards (Full Repository Ruff)
        shell: bash
        run: |
          mapfile -t PY_FILES < <(git ls-files '*.py')
          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            ruff check --select E4,E7,E9,F "${PY_FILES[@]}"
          else
            echo "No tracked Python files found."
          fi

      - name: Validate Strict Typing Signatures (Full Repository Mypy)
        shell: bash
        run: |
          mapfile -t PY_FILES < <(git ls-files '*.py' | grep -v '^tests/')
          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            mypy "${PY_FILES[@]}"
          else
            echo "No tracked application Python files found."
          fi

      - name: Execute Python Test Matrix Enforcing Coverage Threshold Limits
        env:
          PYTHONPATH: .
        run: |
          python -m pytest --cov=. --cov-fail-under=80 -v tests/

  rust-edge-engine:
    name: Rust verification core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run Rust verification tests
        run: cargo test --manifest-path Cargo.toml

      - name: Commit Cargo.lock when bootstrapping the Rust crate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build(deps): add Cargo.lock"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify locked Rust dependency graph
        run: cargo test --locked --manifest-path Cargo.toml

      - name: Run Rust static analysis
        run: cargo clippy --locked --manifest-path Cargo.toml --all-targets -- -D warnings
