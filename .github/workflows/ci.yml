name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Ensures that mid-flight builds cancel if you push a new commit to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov python-dotenv

      - name: Run Linter (Ruff)
        run: ruff check .

      - name: Run Type Checker (Mypy)
        run: mypy . --ignore-missing-imports

  test:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure test tools are present even if unpinned in requirements
          pip install pytest pytest-cov python-dotenv

      - name: Run tests with coverage gate
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=70
