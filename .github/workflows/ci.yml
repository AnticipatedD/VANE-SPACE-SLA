name: VANE-SPACE-SLA CI Pipeline Verification Dashboard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Runtime (Frontend Linter Check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Javascript Quality Checks
        run: |
          if [ -f package.json ]; then
            npm install
            npm run lint
            npm test
          fi

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Requirements Stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Execute Security Dependency Audits
        run: pip-audit

      - name: Verify Code Cleanliness Standards (Ruff Engine)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/$GITHUB_BASE_REF"
          else
            BASE_REF="$GITHUB_EVENT_BEFORE"
          fi

          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            mapfile -t PY_FILES < <(git ls-files '*.py')
          else
            mapfile -t PY_FILES < <(git diff --name-only --diff-filter=ACMRT "$BASE_REF" HEAD -- '*.py')
          fi

          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            ruff check --select E4,E7,E9,F "${PY_FILES[@]}"
          else
            echo "No changed Python files; skipping Ruff lint."
          fi

      - name: Validate Strict Typing Signatures (Mypy Engine)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/$GITHUB_BASE_REF"
          else
            BASE_REF="$GITHUB_EVENT_BEFORE"
          fi

          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            mapfile -t PY_FILES < <(git ls-files '*.py' | grep -v '^tests/')
          else
            mapfile -t PY_FILES < <(git diff --name-only --diff-filter=ACMRT "$BASE_REF" HEAD -- '*.py' | grep -v '^tests/')
          fi

          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            mypy "${PY_FILES[@]}"
          else
            echo "No changed Python files; skipping mypy."
          fi

      - name: Execute Python Test Matrix Enforcing Coverage Threshold Limits
        env:
          PYTHONPATH: .
        run: |
          python -m pytest --cov=. --cov-fail-under=80 -v tests/
