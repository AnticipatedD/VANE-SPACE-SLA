name: Terraform Azure Infrastructure

on:
  push:
    branches: ["main", "master"]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: Format, validate, test and scan Azure IaC
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize production configuration without remote state
        run: terraform -chdir=terraform/environments/production init -backend=false -input=false

      - name: Validate production configuration
        run: terraform -chdir=terraform/environments/production validate

      # Planning is enabled only after the repository owner configures an Azure
      # service-principal JSON secret. No infrastructure is applied by this workflow.
      - name: Authenticate to Azure for production plan
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Create production Terraform plan
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        run: terraform -chdir=terraform/environments/production plan -input=false -lock=false -out=tfplan

      - name: Explain why production plan was not run
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        run: echo "Production plan skipped: configure the AZURE_CREDENTIALS repository secret to enable authenticated Azure planning."

      - name: Initialize telemetry module test configuration
        run: terraform -chdir=terraform/modules/telemetry init -backend=false -input=false

      - name: Run mocked Terraform module tests
        run: terraform -chdir=terraform/modules/telemetry test

      - name: Scan production Terraform configuration with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/environments/production
          framework: terraform
          soft_fail: false

      - name: Scan telemetry module with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/modules/telemetry
          framework: terraform
          soft_fail: false
