name: Terraform IaC Verification

on:
  push:
    branches: [main, master]
    paths:
      - "terraform/**"
      - "backend.tf"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "terraform/**"
      - "backend.tf"
      - "modules/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: Format, validate, plan-test and scan Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Check formatting across all Terraform files
        run: terraform fmt -check -recursive .

      - name: Initialize production configuration without remote state
        run: terraform -chdir=terraform/environments/production init -backend=false -input=false

      - name: Validate production configuration
        run: terraform -chdir=terraform/environments/production validate

      - name: Initialize telemetry module test configuration
        run: terraform -chdir=terraform/modules/telemetry init -backend=false -input=false

      # The module test file uses command = plan with a mocked Azure provider.
      # This exercises a deterministic plan without cloud credentials or apply permissions.
      - name: Validate telemetry module
        run: terraform -chdir=terraform/modules/telemetry validate

      - name: Run mocked Terraform plan tests
        run: terraform -chdir=terraform/modules/telemetry test

      - name: Scan production Terraform configuration with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/environments/production
          framework: terraform
          soft_fail: false

      - name: Scan telemetry module with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/modules/telemetry
          framework: terraform
          soft_fail: false
